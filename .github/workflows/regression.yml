name: Regression tests

# Two ways this runs:
#   1. Automatically, right after Netlify finishes a deploy. Netlify's GitHub
#      integration posts a "deployment_status" event to this repo when a
#      deploy succeeds, and this workflow reacts to that.
#   2. Manually, any time, from the Actions tab ("Run workflow"), optionally
#      against a different URL (e.g. a deploy preview).
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      test_url:
        description: 'URL to test (defaults to production if left blank)'
        required: false
        default: ''

jobs:
  regression:
    # For automatic runs, only act once Netlify reports success - ignore
    # in-progress/failed deploy notifications and non-Netlify deployments.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.target_url != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Resolve target URL
        id: url
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.test_url }}" ]; then
            echo "url=${{ github.event.inputs.test_url }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.deployment_status.target_url }}" ]; then
            echo "url=${{ github.event.deployment_status.target_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ vars.PRODUCTION_URL }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run regression suite
        env:
          TEST_URL: ${{ steps.url.outputs.url }}
        run: npx playwright test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/report
          retention-days: 14

      - name: Upload traces/screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results
          retention-days: 14
